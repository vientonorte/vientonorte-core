# Publica los paquetes del workspace en GitHub Packages (scope @vientonorte).
# Disparo manual (workflow_dispatch): pnpm -r publish omite versiones ya
# publicadas, así que es seguro re-ejecutarlo tras cada bump de versión.
# analytics y cli están marcados private y no se publican (Fase 4/5).
#
# Auth: setup-node escribe el token en el ~/.npmrc del runner (user-level),
# que pnpm 10 sí acepta — el .npmrc del repo se ignora por seguridad.
# Si GITHUB_TOKEN no tiene acceso de escritura a un paquete ya existente
# (publicado fuera de este repo), definir el secret VN_PACKAGES_TOKEN con
# un PAT classic con scope write:packages.
name: Publish (GitHub Packages)

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Paquete a publicar (ej. @vientonorte/skills). Vacío = todos (pnpm -r).'
        type: string
        required: false
        default: ''
      tag:
        description: 'dist-tag npm. Distinto de latest exige versión prerelease (-algo).'
        type: string
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vientonorte'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verificar (typecheck + build + test)
        run: |
          pnpm -r typecheck
          pnpm -r build
          pnpm -r test

      - name: Validar prerelease si tag != latest
        if: ${{ inputs.tag != '' && inputs.tag != 'latest' }}
        env:
          PKG: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$PKG" ]; then SEL="--filter $PKG"; else SEL="-r"; fi
          bad=0
          for line in $(pnpm $SEL exec node -p "const p=require('./package.json'); p.private ? '' : p.name+'@'+p.version"); do
            v="${line##*@}"
            case "$v" in
              *-*) echo "ok: $line" ;;
              *) echo "::error::tag '$TAG' requiere versión prerelease (-algo); $line no la tiene"; bad=1 ;;
            esac
          done
          exit $bad

      - name: Publicar paquetes con versión nueva
        env:
          PKG: ${{ inputs.package }}
          TAG: ${{ inputs.tag || 'latest' }}
          NODE_AUTH_TOKEN: ${{ secrets.VN_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$PKG" ]; then
            pnpm --filter "$PKG" publish --no-git-checks --tag "$TAG"
          else
            pnpm -r publish --no-git-checks --tag "$TAG"
          fi
